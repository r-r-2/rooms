<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Short-term rental, 2026 · Rooms I've lived in</title>
<meta name="description" content="A short-term rental from 2026, rebuilt in 3D from an iPhone LiDAR scan. Walk through it room by room.">

<link rel="canonical" href="https://rooms.rr2.dev/rental-2026/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Rooms I've lived in">
<meta property="og:url" content="https://rooms.rr2.dev/rental-2026/">
<meta property="og:title" content="Short-term rental, 2026 · Rooms I've lived in">
<meta property="og:description" content="A short-term rental from 2026, rebuilt in 3D from an iPhone LiDAR scan. Walk through it room by room.">

<meta property="og:video" content="https://rooms.rr2.dev/rental-2026/media/launch.mp4">
<meta property="og:video:secure_url" content="https://rooms.rr2.dev/rental-2026/media/launch.mp4">
<meta property="og:video:type" content="video/mp4">
<meta property="og:video:width" content="1280">
<meta property="og:video:height" content="720">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Short-term rental, 2026 · Rooms I've lived in">
<meta name="twitter:description" content="A short-term rental from 2026, rebuilt in 3D from an iPhone LiDAR scan. Walk through it room by room.">
<meta name="twitter:image" content="https://rooms.rr2.dev/rental-2026/stills/og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500&family=Atkinson+Hyperlegible+Next:wght@400;500;600&display=swap">
<link rel="stylesheet" href="src/style.css">
<script src="../../analytics.js"></script>
<script type="importmap">
{ "imports": { "three": "../../vendor/three/three.module.js", "three/addons/": "../../vendor/three/addons/" } }
</script>
</head>
<body>
<main>
  <canvas id="c" aria-label="3D model of the apartment"></canvas>

  <div class="top">
    <a id="title" class="place-name" href="../index.html">Short-term rental, 2026</a>
    <button id="btn-close" class="round" aria-label="Back to the view from above" hidden>
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <span id="roompill" class="where" hidden></span>
    <button id="btn-more" class="round" aria-label="Menu" aria-haspopup="dialog" hidden>
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    </button>
  </div>

  <div id="bottom" class="bottom" hidden>
    <button id="btn-rooms" class="pill" aria-haspopup="dialog">Rooms</button>
    <nav id="modes" class="seg" aria-label="View">
      <button id="btn-orbit" aria-pressed="true">From above</button>
      <button id="btn-day" aria-pressed="false">Walkthrough</button>
      <button id="btn-walk" aria-pressed="false">Walk</button>
    </nav>
  </div>

  <section id="tourbar" class="tourbar" aria-label="Walkthrough" hidden>
    <button id="btn-pause" class="round outline" aria-label="Pause" aria-pressed="false">
      <svg class="i-pause" aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg>
      <svg class="i-play" aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9-5.5z"/></svg>
    </button>
    <button id="tour-room" class="tour-room" aria-haspopup="dialog" aria-label="Jump to a room">Living room <small>1 of 5</small></button>
    <button id="btn-nextroom" class="pill dark">Next room</button>
    <span id="progress" class="progress"></span>
  </section>

  <dialog id="welcome" class="sheet welcome" aria-labelledby="w-title">
    <button id="w-sound" class="round sound" aria-label="Room sound" aria-pressed="false">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="waves" d="M16.5 9.5a3.5 3.5 0 0 1 0 5M19 7a7 7 0 0 1 0 10"/><path class="mute" d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>
    </button>
    <h2 id="w-title">Short-term rental, 2026</h2>
    <p>Rebuilt in 3D from an iPhone scan I took before moving out.</p>
    <button data-go="orbit" class="big dark">Look from above</button>
    <div class="pair"><button data-go="tour" class="big">Walkthrough</button><button data-go="walk" class="big">Walk</button></div>
    <p class="tip">Tap doors, lights and curtains. They work.</p>
  </dialog>

  <dialog id="menu" class="sheet menu" aria-label="Menu">
    <div class="grab" aria-hidden="true"></div>
    <div class="row"><span>Light</span><div id="times" class="times" role="group" aria-label="Time of day"></div></div>
    <div class="row"><span>Room sound</span><button id="m-sound" class="switch" role="switch" aria-checked="false" aria-label="Room sound"></button></div>
    <button id="m-replay" class="row link">Replay the intro</button>
    <button id="m-share" class="row link">Share this place</button>
    <button id="m-help" class="row link">How to use</button>
    <a class="row link" href="../../index.html">All rooms I've lived in</a>
    <p class="credit">Developed by Rahul (<a href="https://rr2.dev">rr2.dev</a>)</p>
  </dialog>

  <dialog id="roomsheet" class="sheet" aria-label="Rooms">
    <div class="grab" aria-hidden="true"></div>
    <div id="rooms" class="roomgrid"></div>
  </dialog>

  <div id="aim" class="aim" hidden><i></i></div>
  <button id="btn-use" class="pill dark use" hidden>Open or close</button>

  <div id="pad" class="pad" aria-hidden="true" hidden><span></span></div>
  <div id="hint" class="hint" hidden></div>
  <button id="btn-skip" class="pill skip" hidden>Skip intro</button>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
